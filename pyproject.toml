[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sift"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["pypdf", "python-pptx", "reportlab.pdfgen"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
sift = "sift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100